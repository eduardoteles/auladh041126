<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/styles.css">
    <title>FlexBox</title>
</head>

<body>
     <main>
            <div class="containergrid">
                <div class="topleft">
                     <img src="https://images.pexels.com/photos/619423/pexels-photo-619423.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Imagem 1">
                     <p>Design Hipermedia CSS Halloween</p>
                     <hr/>
                </div>
                <div class="bottomleft">
                    <img src="https://media.istockphoto.com/id/175195916/photo/halloween-casino-witch-with-smoking-pipe-and-pumpkins.jpg?s=612x612&w=is&k=20&c=vlH2OV6tCuh_h2IwvP0GHks41uKbhBlzucZNhUkiuCA=" alt="Imagem 1">
                </div>
                <div class="topright">
                    <div class="flex-container">
                        <div class="flex-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNB22JMgeO4DHHuIrVvhsKkXVhbCr6NO3Y_C5B0FKb-6qkrH1vvIAJiOQ&s=10" alt="Imagem 1"></div>
                        <div class="flex-item">Os melhores sites de Halloween</div>
                    </div>
                </div>
                <div class="bottomright">
                    <div class="flex-container-2">
                        <div class="flex-item-2"><img src="https://media.istockphoto.com/id/1174282589/photo/halloween-jack-o-lantern-bucket-filled-with-candy-isolated-on-white.jpg?s=612x612&w=0&k=20&c=tuvcuOM1xD8Pfj9yLl9mjYqyssOxr_bqjuTZwykE-CE=" alt="Imagem 1"></div>
                        <div class="flex-item-2">Login</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
